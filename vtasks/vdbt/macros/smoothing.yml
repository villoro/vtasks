version: 2

macros:
  - name: monthly_grid
    description: >
      Aggregates a relation to monthly grain and returns a complete grid with one row per
      month and dimension combination, filling the months that have no data.


      This is a required first step before `savgol_smooth`, not an optional cleanup.
      The smoother matches neighbours by month index, so a missing month does not create
      a gap: it makes the months on either side of the hole behave as if they were
      consecutive, and the resulting trend is silently wrong. Holes are common in the
      expensor series, where a month can have no income at all, and very common once the
      series is split by category.


      Adds an `is_filled` boolean marking the rows that were invented.


      The macro expands to a full `WITH ... SELECT` query, so the call must be wrapped in
      its own CTE.
    arguments:
      - name: relation
        description: Relation to read from, either a `ref()` or the name of an earlier CTE.
      - name: date_column
        description: Date or timestamp column that is truncated to month.
      - name: measure
        description: Numeric column to sum per month and dimension combination.
      - name: dims
        description: >
          List of dimension columns the grid is expanded over, for example `['category']`.
          Defaults to an empty list, which produces a single series.
      - name: fill
        description: >
          How to fill the months with no data. `zero` for flow measures, where a missing
          month means nothing happened (expenses, hours logged, pages read). `forward` for
          stock measures, where a missing month means unchanged since last time (account
          balances, net worth); filling those with zero would be wrong. Defaults to `zero`.

  - name: savgol_smooth
    description: >
      Adds a smoothed column to a monthly series using a Savitzky-Golay filter, optionally
      followed by a short centred moving average.


      A Savitzky-Golay filter fits a polynomial of `degree` over a sliding window of
      `window_size` months and keeps the value of that fit at the centre of the window.
      For a fixed pair those weights are constants, independent of the data, which is what
      lets the filter run as a plain weighted sum against the `smoothing_weights` seed.
      Add new pairs with `scripts/gen_smoothing_weights.py`.


      The filter is centred, so it uses future months as well as past ones. The trend over
      the last `window_size / 2` months therefore keeps moving as new data arrives, and
      consumers are expected to flag or hide that region.


      Note the weights include negative lobes, so an isolated spike in a sparse series rings
      negative on both sides and the trend can go below zero. That is inherent to the kernel
      and is not fixed by lowering the degree, so this filter suits dense aggregate series
      rather than sparse ones.


      `relation` must already be a complete monthly grid produced by `monthly_grid`, and it
      must expose a `month` column, which is what the filter indexes on. The macro expands
      to a full `WITH ... SELECT` query, so the call must be wrapped in its own CTE.
    arguments:
      - name: relation
        description: Relation holding the complete monthly grid, either a `ref()` or the name of an earlier CTE.
      - name: measure
        description: Numeric column to smooth.
      - name: dims
        description: >
          List of dimension columns that identify each series. Each combination is smoothed
          independently. Defaults to an empty list, which smooths a single series.
      - name: window_size
        description: >
          Number of months the polynomial is fitted over. Must be odd, and must exist in the
          `smoothing_weights` seed for the given degree. A good starting point is 20-25% of
          the series length, and at least 4x the degree. Defaults to 35.
      - name: degree
        description: >
          Degree of the fitted polynomial. Higher degrees follow turning points faster but
          are less stable at the edges of the series. Defaults to 5.
      - name: post_window
        description: >
          Size of the centred moving average applied after the filter. Must be odd. Use 1 to
          disable it. Defaults to 3.
      - name: out_column
        description: Name of the smoothed column that is added. Defaults to `trend`.
